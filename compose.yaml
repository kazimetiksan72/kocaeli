name: kocaeli-sehir
services:
  db:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sehir}
      POSTGRES_USER: ${POSTGRES_USER:-sehir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sehir_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sehir} -d ${POSTGRES_DB:-sehir}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ["1025:1025", "8025:8025"]
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sehir}
      DB_USER: ${POSTGRES_USER:-sehir}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sehir_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
      MOCK_AUTH_ENABLED: ${MOCK_AUTH_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["5173:80"]
volumes:
  postgres_data:
  minio_data:
